{% extends "base.html" %}

{% block title %}Create Admin - {{ site_name }}{% endblock %}

{% block content %}
<div class="create-admin-page" style="max-width: 600px; margin: 0 auto; padding: 20px 0;">
    <div class="create-admin-card" style="background: var(--secondary-bg, #253449); border-radius: var(--radius, 16px); border: 1px solid rgba(201, 168, 75, 0.04); padding: 32px 36px;">
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--white, #FFFFFF); margin: 0 0 24px; text-align: center;">
            <i class="fas fa-user-cog" style="color: var(--primary-gold, #C9A84B);"></i> Create Admin
        </h1>

        <form method="POST">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <!-- Username -->
                <div>
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-gray, #C8CED8); display: block; margin-bottom: 4px;">
                        <i class="fas fa-user" style="color: var(--primary-gold, #C9A84B);"></i> Username
                    </label>
                    <input type="text" name="username" required
                           style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(201, 168, 75, 0.04); background: var(--primary-bg, #0A1527); color: var(--text-gray, #C8CED8); font-size: 0.95rem;">
                </div>

                <!-- Email -->
                <div>
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-gray, #C8CED8); display: block; margin-bottom: 4px;">
                        <i class="fas fa-envelope" style="color: var(--primary-gold, #C9A84B);"></i> Email
                    </label>
                    <input type="email" name="email" required
                           style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(201, 168, 75, 0.04); background: var(--primary-bg, #0A1527); color: var(--text-gray, #C8CED8); font-size: 0.95rem;">
                </div>

                <!-- Password -->
                <div>
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-gray, #C8CED8); display: block; margin-bottom: 4px;">
                        <i class="fas fa-lock" style="color: var(--primary-gold, #C9A84B);"></i> Password
                    </label>
                    <input type="password" name="password" required
                           style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(201, 168, 75, 0.04); background: var(--primary-bg, #0A1527); color: var(--text-gray, #C8CED8); font-size: 0.95rem;">
                </div>

                <!-- Assigned Courses -->
                <div>
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-gray, #C8CED8); display: block; margin-bottom: 4px;">
                        <i class="fas fa-book" style="color: var(--primary-gold, #C9A84B);"></i> Assigned Courses
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(201, 168, 75, 0.04); background: var(--primary-bg, #0A1527); max-height: 200px; overflow-y: auto;">
                        {% if courses %}
                            {% for course in courses %}
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-gray, #C8CED8); cursor: pointer;">
                                <input type="checkbox" name="courses" value="{{ course.id }}">
                                {{ course.name }} ({{ course.code }})
                            </label>
                            {% endfor %}
                        {% else %}
                            <p style="color: var(--text-muted, #8A94A6); font-size: 0.85rem;">No courses available. Create a course first.</p>
                        {% endif %}
                    </div>
                </div>

                <!-- Actions -->
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; padding: 10px; border-radius: 60px; font-weight: 600; font-size: 0.9rem; background: linear-gradient(135deg, var(--primary-gold, #C9A84B), var(--dark-gold, #8F7E48)); color: var(--white, #FFFFFF); border: none; cursor: pointer;">
                        <i class="fas fa-user-plus"></i> Create Admin
                    </button>
                    <a href="{{ url_for('admin.manage_admins') }}" class="btn btn-outline" style="flex: 1; padding: 10px; border-radius: 60px; font-weight: 600; font-size: 0.9rem; background: transparent; color: var(--text-gray, #C8CED8); border: 1px solid rgba(201, 168, 75, 0.04); text-decoration: none; text-align: center;">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    transition: var(--transition, 0.3s ease);
    border: none;
    cursor: pointer;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary-gold, #C9A84B), var(--dark-gold, #8F7E48));
    color: var(--white, #FFFFFF);
    box-shadow: 0 2px 16px rgba(201, 168, 75, 0.15);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 24px rgba(201, 168, 75, 0.25);
    color: var(--white, #FFFFFF);
}

.btn-outline {
    background: transparent;
    color: var(--text-gray, #C8CED8);
    border: 1px solid rgba(201, 168, 75, 0.04);
}

.btn-outline:hover {
    background: rgba(201, 168, 75, 0.04);
    border-color: var(--primary-gold, #C9A84B);
    color: var(--primary-gold, #C9A84B);
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .create-admin-card {
        padding: 16px 14px;
    }
    
    .create-admin-page {
        padding: 10px 0;
    }
}
</style>
{% endblock %}
