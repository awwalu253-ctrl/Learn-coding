services:
  - type: web
    name: teachingsite-lms
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: false
      - key: RENDER
        value: true
      - key: PYTHON_VERSION
        value: 3.12.7